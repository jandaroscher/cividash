; PHP runtime overrides for the CiviDash production image.
; Aligns PHP upload/memory limits with nginx client_max_body_size (32m).
memory_limit=256M
upload_max_filesize=32M
post_max_size=32M
max_execution_time=60
expose_php=Off

; Logs go to stderr so they surface in container logs.
log_errors=On
error_log=/dev/stderr
display_errors=Off

date.timezone=UTC
