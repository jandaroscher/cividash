; PHP-FPM pool for the CiviDash production image.
; Overrides the stock pool: TCP listener on 9000, env passthrough, and a
; status/ping endpoint for healthchecks.
[www]
user = www-data
group = www-data

; nginx (cividash-web) reaches FPM at cividash-fpm:9000 over TCP.
listen = 9000

; CRITICAL: keep the injected container environment available to PHP.
; The default php-fpm pool clears env (clear_env=yes); Laravel reads config
; from these vars at config:cache time, so they must pass through.
clear_env = no

; Process manager — dynamic, sized for a modest production container.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Surface worker logs in the container output.
catch_workers_output = yes
decorate_workers_output = no

; Internal-only endpoints used by the Docker HEALTHCHECK (cgi-fcgi /ping).
ping.path = /ping
pm.status_path = /status
