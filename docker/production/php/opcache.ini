; OPcache tuning for the CiviDash production runtime.
; Conservative, production-safe defaults for a long-running PHP-FPM process.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Code is immutable inside the image, so skip per-request timestamp checks.
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1
