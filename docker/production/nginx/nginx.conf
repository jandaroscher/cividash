# CiviDash web server (cividash-web) — serves the Laravel public/ root and proxies PHP
# to the cividash-fpm service. Installed at /etc/nginx/conf.d/default.conf.

server {
    # 8080: the image runs rootless (nginx-unprivileged), no privileged ports.
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # __RESOLVER__ is replaced at container start (docker-entrypoint.d/05-resolver.sh)
    # with NGINX_RESOLVER or the first nameserver from /etc/resolv.conf: Docker's
    # embedded DNS (127.0.0.11) in compose stacks, kube-dns on Kubernetes. Pairing
    # it with a variable upstream in the PHP location below forces nginx to
    # re-resolve the cividash-fpm name per request instead of caching the IP at
    # startup, so a recreated cividash-fpm container/pod no longer triggers 502s.
    resolver __RESOLVER__ valid=10s ipv6=off;

    # Match the PHP upload limits (php.ini upload/post = 32M).
    client_max_body_size 32m;

    # --- Security headers (safe subset only) --------------------------------
    # HSTS and CSP are deliberately NOT set here: HSTS is only safe once TLS is
    # guaranteed for the whole domain, and CSP needs to be tuned per deployment
    # (Filament/Livewire, Fabricator blocks). Both are the operator's
    # responsibility at the TLS-terminating reverse proxy/ingress — see
    # docs/deployment/docker.md "Production hardening". Declared at server
    # level (not in a location block) so no location below can override them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # --- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames under /build, so cache aggressively.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location drops the server-level headers, so repeat them here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # Livewire serves /livewire/livewire.min.js (and /livewire/update, etc.)
    # DYNAMICALLY via PHP — the file does not exist under public/. This prefix
    # match (^~) takes precedence over the static-asset regex below, so these
    # routes reach the front controller instead of 404-ing as missing files.
    # Without it the admin login form has no Livewire JS and POST /admin/login
    # falls back to a native request against the GET-only route -> 405.
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Other common static files: long cache, fall through to 404 (do not hit PHP).
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        # add_header in a location drops the server-level headers, so repeat them here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # Laravel health endpoint (/up) and SPA/Filament/API routes all funnel
    # through the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP via FastCGI ----------------------------------------------------
    location ~ \.php$ {
        # Service name MUST match the compose/k8s FPM service: cividash-fpm:9000.
        # Use a variable upstream so nginx re-resolves it via the resolver above
        # on every request, surviving a cividash-fpm container recreate (new IP).
        # __FPM_UPSTREAM__ is filled at start (05-resolver.sh): "cividash-fpm:9000"
        # on compose, the fully qualified service name on Kubernetes, because
        # nginx's resolver does not apply resolv.conf search domains.
        set $cividash_fpm __FPM_UPSTREAM__;
        fastcgi_pass $cividash_fpm;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # The runtime image has no .htaccess; deny path-info traversal explicitly.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve hidden files (e.g. .env) — except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
