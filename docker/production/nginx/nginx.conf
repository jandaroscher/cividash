# CiviDash web server (cividash-web) — serves the Laravel public/ root and proxies PHP
# to the cividash-fpm service. Installed at /etc/nginx/conf.d/default.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Match the PHP upload limits (php.ini upload/post = 32M).
    client_max_body_size 32m;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # --- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames under /build, so cache aggressively.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Other common static files: long cache, fall through to 404 (do not hit PHP).
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Laravel health endpoint (/up) and SPA/Filament/API routes all funnel
    # through the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP via FastCGI ----------------------------------------------------
    location ~ \.php$ {
        # Service name MUST match the compose/k8s FPM service: cividash-fpm:9000.
        fastcgi_pass cividash-fpm:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # The runtime image has no .htaccess; deny path-info traversal explicitly.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve hidden files (e.g. .env) — except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
