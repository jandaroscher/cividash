# CiviDash production smoke stack.
#
# A self-contained, throwaway environment to verify the production images build
# and boot together: nginx (cividash-web) -> PHP-FPM (cividash-fpm) -> PostgreSQL (cividash-db),
# with a one-shot migrate job. Values inline below are SMOKE-ONLY (non-secret).
#
# Run from the repository root:
#   docker compose -f docker/production/docker-compose.smoke.yml up --build
#
# Then browse:
#   http://localhost:8088/up        -> Laravel health endpoint (expect 200)
#   http://localhost:8088/          -> Vue SPA
#   http://localhost:8088/admin     -> Filament panel
#
# NOTE on APP_KEY: a fixed base64 dev key is hardcoded below for reproducible
# smoke runs. Generate a real one for any non-throwaway use:
#   docker compose ... run --rm cividash-fpm php artisan key:generate --show

name: cividash-smoke

# Anchor: the app-image env shared by every artisan workload (fpm + migrate).
x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  # Smoke-only fixed key (NOT a secret; do not reuse in real deployments).
  APP_KEY: base64:0pCDS0r5o7mFcvVtE3qg2lWg7xJ0mF1nM6n6cYV7H2A=
  APP_URL: http://localhost:8088

  DB_CONNECTION: pgsql
  DB_HOST: cividash-db
  DB_PORT: "5432"
  DB_DATABASE: cividash
  DB_USERNAME: cividash
  DB_PASSWORD: cividash_smoke_pw

  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database

  PUBLIC_DISK_DRIVER: local
  TRUSTED_PROXIES: "*"

  # CIVITAS integration points at the local bare Stellio broker on the host
  # (docker/civitas/v1.6.2 stack, host port 8090). NOTE: the bare broker serves
  # NGSI-LD at /ngsi-ld/v1; behind CORE's APISIX the prod path is /context/ngsi-ld.
  CIVITAS_ENABLED: "true"
  CIVITAS_DRIVER: ngsi-ld
  CIVITAS_API_URL: http://host.docker.internal:8090/ngsi-ld/v1

services:
  # -------------------------------------------------------------------------
  # PostgreSQL — smoke database. Health-gated so dependants wait for readiness.
  # -------------------------------------------------------------------------
  cividash-db:
    image: postgres:16
    environment:
      POSTGRES_DB: cividash
      POSTGRES_USER: cividash
      POSTGRES_PASSWORD: cividash_smoke_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cividash -d cividash"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # PHP-FPM application container (cividash-app image). Serves :9000 to nginx.
  # -------------------------------------------------------------------------
  cividash-fpm:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    image: cividash-app:dev
    environment: *app-env
    volumes:
      # Shared public-media volume so uploads written by FPM are visible to the
      # nginx container (local-disk equivalent of S3 across the split containers).
      - public-media:/var/www/html/storage/app/public
    # Reach a host-side NGSI-LD broker / Keycloak from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cividash-db:
        condition: service_healthy
      cividash-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # One-shot schema migration. Reuses the app image; exits 0 when done.
  # -------------------------------------------------------------------------
  cividash-migrate:
    image: cividash-app:dev
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bypass the cache-warmer entrypoint; run migrations once, then exit.
    entrypoint: ["php", "artisan"]
    command: ["migrate", "--force"]
    depends_on:
      cividash-db:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------------
  # nginx front (cividash-web image). Published on host :8088.
  # -------------------------------------------------------------------------
  cividash-web:
    build:
      context: ../..
      dockerfile: docker/production/nginx/Dockerfile
    image: cividash-web:dev
    volumes:
      # Same public-media volume: the baked public/storage symlink resolves here
      # so nginx serves runtime uploads written by the FPM container.
      - public-media:/var/www/html/storage/app/public
    ports:
      - "8088:8080"
    depends_on:
      - cividash-fpm
    restart: unless-stopped

volumes:
  public-media:
