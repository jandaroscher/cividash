description:
  de:
    shortDescription: "Open-Source-Nachhaltigkeitsdashboard für Kommunen"
    longDescription: >
      CiviDash ist ein Open-Source-Nachhaltigkeitsdashboard für Kommunen, das
      auf Laravel (Backend/Admin via Filament) und Vue 3 (Frontend) basiert.
      Es unterstützt Mehrmandantenfähigkeit (mehrere Dashboards/Tenants) und
      mehrsprachige Inhalte (Deutsch/Englisch). Das zugehörige CIVITAS/CORE-Add-on wird
      separat unter https://gitlab.opencode.de/regensburg_next/cividash-addon gepflegt.
    features:
      - Kennzahl-Kacheln mit Zeitreihen
      - Filter nach Kategoriegruppen
      - Volltextsuche
      - Mehrsprachigkeit (Deutsch/Englisch)
      - Multi-Dashboard / Mandantenfähigkeit
      - Filament-Admin mit Seitenbaukasten
      - Datenimport (JSON/CSV)
      - CIVITAS/CORE-Integration
    documentation: "https://gitlab.opencode.de/regensburg_next/cividash/-/tree/main/docs"
    apiDocumentation: "https://gitlab.opencode.de/regensburg_next/cividash/-/tree/main/docs/api"
  en:
    shortDescription: "Open-source sustainability dashboard for municipalities"
    longDescription: >
      CiviDash is an open-source sustainability dashboard for municipalities,
      built on Laravel (backend/admin via Filament) and Vue 3 (frontend). It
      supports multi-tenancy (multiple dashboards/tenants) and multilingual
      content (German/English). The related CIVITAS/CORE add-on is maintained
      separately at https://gitlab.opencode.de/regensburg_next/cividash-addon.
    features:
      - KPI tiles with time series
      - Filtering by category groups
      - Full-text search
      - Multilingual content (German/English)
      - Multi-dashboard / multi-tenancy
      - Filament admin with page builder
      - Data import (JSON/CSV)
      - CIVITAS/CORE integration
    documentation: "https://gitlab.opencode.de/regensburg_next/cividash/-/tree/main/docs"
    apiDocumentation: "https://gitlab.opencode.de/regensburg_next/cividash/-/tree/main/docs/api"
