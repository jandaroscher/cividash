name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

env:
  PHP_VERSION: '8.2'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, unit tests, audit, build)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Node Security Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Build frontend assets
        run: npm run build

  php-audit:
    name: PHP dependency audit
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The product core must not carry tenant-specific (Regensburg) names or content.
      - name: Check product core for tenant-specific names
        run: |
          set +e
          git grep -n -i regensburg -- app config database resources tests
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Tenant-specific name found in the product core (see matches above)."
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep failed with exit code $status."
            exit "$status"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring,intl,bcmath,gd,curl,xml,zip,pdo_pgsql,redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-pg-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-pg-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev
        env:
          COMPOSER_PROCESS_TIMEOUT: 200

      - name: PHP Security Audit (composer audit)
        run: composer audit --no-dev
