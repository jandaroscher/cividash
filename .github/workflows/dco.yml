name: DCO

# Every commit that lands on main needs a Developer Certificate of Origin
# sign-off by a person (see CONTRIBUTING.md). Pull request branches are not
# checked: commits there may come from AI assistants, and the maintainer signs
# off on the squash merge.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-off on pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # Branch creation: only the pushed tip is new.
            range="$AFTER^!"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            echo "::error::Previous tip $BEFORE is gone (force push?); check the history by hand."
            exit 1
          fi
          .github/scripts/check-dco.sh "$range"
