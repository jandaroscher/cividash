name: Dispatch deploy

# Notifies an external deployment pipeline after a push to main. This
# repository contains no deploy logic; hosted deployments are maintained
# outside it. The job is skipped when the variable below is not set, e.g. on
# forks.
#
# Repository variable:
#   DEPLOY_DISPATCH_REPO  owner/name of the repository that receives a
#                         repository_dispatch event of type product-main-pushed
# Repository secret:
#   OPS_DISPATCH_TOKEN    fine-grained PAT for that repository with
#                         "Contents: read and write"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions: {}

jobs:
  dispatch:
    name: Trigger external deploy
    runs-on: ubuntu-latest
    if: vars.DEPLOY_DISPATCH_REPO != ''
    steps:
      - name: Send repository_dispatch
        env:
          TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          SHA: ${{ github.sha }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d "{\"event_type\":\"product-main-pushed\",\"client_payload\":{\"ref\":\"main\",\"sha\":\"${SHA}\"}}"
