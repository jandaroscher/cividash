name: Release images

# Publishes the production images (cividash-app, cividash-web) to GHCR for a
# release tag and attaches SPDX SBOMs (source lockfiles and both images) to the
# GitHub release. release-please calls this after it creates a release; run it
# manually to (re)publish an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: write  # upload the SBOMs as release assets
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Two runs for the same tag would push and scan the same mutable image tags.
    concurrency:
      group: release-images-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/jandaroscher
    steps:
      # The Syft config comes from the workflow revision, so republishing an
      # older tag that predates it still produces the source SBOM.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/syft-source.yaml
          sparse-checkout-cone-mode: false

      - name: Keep the Syft config outside the workspace
        run: cp .github/syft-source.yaml "$RUNNER_TEMP/syft-source.yaml"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Compute tags
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build & push cividash-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/cividash-app:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/cividash-app:${{ steps.v.outputs.minor }}
            ${{ env.REGISTRY }}/cividash-app:latest

      - name: Build & push cividash-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/production/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          # cividash-web copies public/ from the app image of the same version.
          build-args: |
            APP_IMAGE=${{ env.REGISTRY }}/cividash-app:${{ steps.v.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/cividash-web:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/cividash-web:${{ steps.v.outputs.minor }}
            ${{ env.REGISTRY }}/cividash-web:latest

      # SBOMs: the source scan covers composer.lock and package-lock.json with
      # all transitive packages, the image scans cover what actually ships.
      - name: SBOM for the source lockfiles
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          config: ${{ runner.temp }}/syft-source.yaml
          format: spdx-json
          output-file: cividash-${{ steps.v.outputs.version }}-source.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: SBOM for cividash-app
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/cividash-app:${{ steps.v.outputs.version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: cividash-app-${{ steps.v.outputs.version }}.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: SBOM for cividash-web
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/cividash-web:${{ steps.v.outputs.version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: cividash-web-${{ steps.v.outputs.version }}.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "cividash-$VERSION-source.spdx.json" \
            "cividash-app-$VERSION.spdx.json" \
            "cividash-web-$VERSION.spdx.json"
