# Syft config for the source SBOM: keep the scan to the application's
# production dependencies. GitHub Actions used by CI are not part of what
# ships, and Syft leaves Composer packages-dev and npm devDependencies out by
# default, so anything bundled into the frontend belongs in dependencies.
select-catalogers:
  - "-github-actions"
